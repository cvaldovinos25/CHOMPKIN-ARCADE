<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000010">
<title>Chompkin Arcade | Noche de dulces</title>
<link rel="preload" href="fonts/ARCADE_N.TTF" as="font" type="font/ttf" crossorigin>
<style>
@font-face{font-family:"Arcade Normal";src:url(fonts/ARCADE_N.TTF) format("truetype");font-display:block}
:root{--arc:"Arcade Normal",ui-monospace,Menlo,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
.hidden{display:none!important}
#intro{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center;background:radial-gradient(120% 90% at 50% 20%,#0b1a6b 0%,#02021a 55%,#000 100%)}
#intro .bats{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.bats i{position:absolute;font-style:normal;font-size:26px;animation:fly 9s linear infinite}
.bats i:nth-child(1){top:14%;left:-10%}.bats i:nth-child(2){top:30%;left:-10%;animation-delay:3s;font-size:20px}.bats i:nth-child(3){top:62%;left:-10%;animation-delay:6s;font-size:30px}
@keyframes fly{to{transform:translateX(125vw) translateY(-30px)}}
h1{margin:0;font-family:var(--arc);font-weight:400;font-size:clamp(26px,9.4vw,50px);line-height:1.3;display:flex;justify-content:center;filter:drop-shadow(0 0 14px rgba(70,100,255,.85));animation:flick 5s infinite}
h1 .ltr{display:inline-block;background:linear-gradient(#fff 0%,#7ff6ff 45%,#6a7bff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2px #04083a;paint-order:stroke fill;animation:wave 1.6s ease-in-out infinite;filter:drop-shadow(3px 4px 0 #1a2a9a)}
h1 .ltr.y{background-image:linear-gradient(#fffbc0 0%,#ffd400 45%,#ff7a00 100%);filter:drop-shadow(3px 4px 0 #8a3a00)}
@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes flick{0%,92%,100%{opacity:1}94%{opacity:.7}96%{opacity:1}98%{opacity:.8}}
.sub{font-size:13px;line-height:1.7;color:#b9c4ff;max-width:420px}
.how{font-size:13px;line-height:1.8;color:#fff;background:rgba(255,255,255,.06);border:2px solid rgba(90,120,255,.6);border-radius:14px;padding:14px 16px;max-width:420px;text-align:left}
.how b{color:#ffd400}
#tap{font-family:var(--arc);font-size:10px;color:#7ff6ff;min-height:14px;animation:bl 1s steps(2) infinite}
.btn{font-family:var(--arc);border:0;border-radius:6px;padding:16px 28px;font-size:16px;letter-spacing:.05em;background:#ffd400;color:#2b1a00;box-shadow:0 6px 0 #b38600,0 0 24px rgba(255,212,0,.6)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b38600}
.blink{animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:.3}}
.mini{position:fixed;z-index:30;bottom:calc(12px + env(safe-area-inset-bottom));right:12px;width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(0,0,30,.6);font-size:18px;color:#fff}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<canvas id="gc"></canvas>
<div id="yt" style="position:fixed;left:-400px;top:0;width:200px;height:200px;pointer-events:none"></div>
<button id="bMute" class="mini" aria-label="Sonido">🔊</button>
<div id="intro">
  <div class="bats"><i>🦇</i><i>🦇</i><i>🦇</i></div>
  <h1>Chomp<em style="font-style:normal">kin</em></h1>
  <p class="sub">La noche de dulces.<br>Juego arcade de Halloween.</p>
  <div class="how">
    <b>1.</b> Desliza el dedo (o usa las flechas) para mover la calabaza y comer todos los dulces.<br>
    <b>2.</b> Esquiva a los murciélagos. Con las pastillas brillantes, ¡ellos te temen y puedes cazarlos!
  </div>
  <div id="tap">TOCA PARA ACTIVAR EL SONIDO</div>
  <button class="btn blink" id="play">▶ PLAY</button>
</div>
<script src="js/audio.js"></script>
<script src="js/main.js"></script>
</body>
</html>
